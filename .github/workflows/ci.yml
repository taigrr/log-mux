name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'cd/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Test
        run: go test -race ./...

      - name: Staticcheck
        run: staticcheck ./...
